<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151920">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="台灯控制">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <title>台灯控制台</title>
  <style>
    :root {
      --bg-top: #f7f8fa;
      --bg-bottom: #eceef2;
      --panel: rgba(255, 255, 255, 0.44);
      --panel-2: rgba(255, 255, 255, 0.46);
      --ink: #111217;
      --muted: #4f5561;
      --ok: #1b8b5f;
      --warn: #9b7400;
      --danger: #b3271f;
      --accent: #5f88c2;
      --accent-soft: #eef4ff;
      --border: rgba(20, 25, 35, 0.028);
      --shadow: 0 26px 72px rgba(17, 24, 39, 0.11);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 15px;
      line-height: 1.45;
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 208, 146, 0.18), rgba(255, 208, 146, 0)),
        radial-gradient(circle at 82% 10%, rgba(147, 186, 246, 0.23), rgba(147, 186, 246, 0)),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      width: 56vw;
      height: 56vw;
      max-width: 760px;
      max-height: 760px;
      top: -18vw;
      right: -10vw;
      background: radial-gradient(circle, rgba(122, 162, 221, 0.46), rgba(122, 162, 221, 0));
      filter: blur(18px);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 34vw;
      height: 34vw;
      max-width: 480px;
      max-height: 480px;
      left: -8vw;
      bottom: -10vw;
      background: radial-gradient(circle, rgba(244, 193, 122, 0.4), rgba(244, 193, 122, 0));
      filter: blur(18px);
      pointer-events: none;
    }

    .app {
      width: min(940px, 100%);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 420ms ease-out;
      position: relative;
      backdrop-filter: saturate(165%) blur(30px);
      -webkit-backdrop-filter: saturate(165%) blur(30px);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        130deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.05) 28%,
        rgba(255, 255, 255, 0.02) 62%,
        rgba(255, 255, 255, 0.1) 100%
      );
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.12);
    }

    .hero {
      position: relative;
      padding: 24px 24px 18px;
      background:
        radial-gradient(circle at 80% 8%, rgba(121, 167, 231, 0.26), rgba(121, 167, 231, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.28));
      border-bottom: 1px solid rgba(20, 25, 35, 0.022);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hero-tag {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(101, 132, 173, 0.12);
      border: 1px solid rgba(101, 132, 173, 0.24);
      color: #476489;
      font-size: 11px;
      letter-spacing: 0.3px;
      font-weight: 600;
    }

    .theme-toggle {
      border: 1px solid rgba(121, 129, 145, 0.16);
      border-radius: 999px;
      padding: 6px 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(242, 244, 248, 0.48));
      color: #3f434a;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px) saturate(130%);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
      transition: transform 140ms ease, background 160ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(236, 239, 245, 0.54));
    }

    .hero h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 640;
      letter-spacing: -0.4px;
      color: #1d1d1f;
      line-height: 1.12;
      margin-bottom: 2px;
    }

    .hero p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      max-width: 580px;
      line-height: 1.5;
      font-weight: 450;
    }

    .status-bar {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.33);
      border: 1px solid var(--border);
      color: #3c424d;
      border-radius: 999px;
      font-size: 12.5px;
      padding: 6px 11px;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      backdrop-filter: saturate(116%);
      -webkit-backdrop-filter: saturate(116%);
    }

    .chip.on { background: #f5f6f8; border-color: #dfe2e8; color: #32353b; }
    .chip.off { background: #fbfbfc; border-color: #e7e8ec; color: #666871; }
    .chip#chip-brightness { background: #f2f6ff; border-color: #d8e2f5; color: #455a7d; }
    .chip#chip-temp { background: #fff7ed; border-color: #f1debf; color: #7d6140; }

    .body {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 18px;
      padding: 20px;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      animation: cardIn 500ms ease both;
      backdrop-filter: blur(16px) saturate(132%);
      -webkit-backdrop-filter: blur(16px) saturate(132%);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    .card:nth-child(2) { animation-delay: 120ms; }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 650;
      color: #1c1f26;
    }

    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .line + .line { margin-top: 12px; }
    .line-controls { display: flex; align-items: center; gap: 8px; }

    .button-row { display: flex; gap: 10px; }
    .btn {
      border: 1px solid rgba(121, 129, 145, 0.16);
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 580;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 160ms ease, opacity 120ms ease, background 160ms ease;
      box-shadow: 0 2px 8px rgba(31, 41, 55, 0.06);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(242, 244, 248, 0.46));
      color: #2f3238;
      backdrop-filter: saturate(114%);
      -webkit-backdrop-filter: saturate(114%);
    }
    .btn:hover { transform: translateY(-1px); background: linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(236, 239, 245, 0.54)); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-on,
    .btn-off,
    .btn-ghost {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(242, 243, 246, 0.46));
      color: #2f3238;
      border-color: rgba(121, 129, 145, 0.16);
      box-shadow: 0 2px 8px rgba(31, 41, 55, 0.05);
    }

    .btn-on {
      border-color: #c8d9ef;
      background: linear-gradient(180deg, #f8fbff, #edf3fb);
      color: #405a80;
    }

    .btn-off {
      border-color: #e4d7cc;
      background: linear-gradient(180deg, #fffcf7, #f6efe5);
      color: #6e5642;
    }

    .number-input {
      width: 92px;
      border: 1px solid rgba(121, 129, 145, 0.16);
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 14px;
      color: #1f222a;
      backdrop-filter: saturate(116%);
      -webkit-backdrop-filter: saturate(116%);
    }

    .number-input:focus {
      outline: 3px solid rgba(141, 145, 153, 0.2);
      border-color: #a4a9b2;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .range-wrap { width: 100%; }
    .range-meta {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }

    .scene-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .scene {
      border: 1px solid rgba(121, 129, 145, 0.14);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(244, 245, 248, 0.46));
      color: #3f434a;
      box-shadow: 0 1px 5px rgba(31, 41, 55, 0.04);
    }

    .scene[data-scene="自然"],
    .scene[data-scene="冷白"],
    .scene[data-scene="阅读"],
    .scene[data-scene="睡前"] {
      border-color: #d8dce3;
      color: #3f434a;
    }

    .scene[data-scene="暖白"] {
      background: linear-gradient(180deg, rgba(255, 253, 250, 0.84), rgba(247, 242, 233, 0.66));
      border-color: rgba(170, 148, 114, 0.24);
      color: #6d5b43;
    }

    .scene[data-scene="自然"] {
      background: linear-gradient(180deg, rgba(251, 253, 248, 0.84), rgba(241, 245, 234, 0.66));
      border-color: rgba(134, 153, 116, 0.24);
      color: #55654a;
    }

    .scene[data-scene="冷白"] {
      background: linear-gradient(180deg, rgba(249, 252, 255, 0.84), rgba(237, 243, 251, 0.66));
      border-color: rgba(121, 150, 186, 0.24);
      color: #4a5e7d;
    }

    .scene[data-scene="阅读"] {
      background: linear-gradient(180deg, rgba(246, 251, 255, 0.84), rgba(234, 242, 251, 0.66));
      border-color: rgba(112, 142, 178, 0.24);
      color: #47607e;
    }

    .scene[data-scene="睡前"] {
      background: linear-gradient(180deg, rgba(255, 249, 241, 0.84), rgba(247, 236, 221, 0.66));
      border-color: rgba(176, 144, 102, 0.24);
      color: #785f3f;
    }

    .scene-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 420;
    }

    .sync-line {
      margin-top: 18px;
    }

    .toast {
      margin-top: 12px;
      min-height: 22px;
      font-size: 13.5px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid rgba(121, 129, 145, 0.14);
      border-radius: 10px;
      padding: 8px 10px;
      backdrop-filter: saturate(114%);
      -webkit-backdrop-filter: saturate(114%);
      font-weight: 430;
    }
    .toast.ok { color: #3e516e; border-color: #d3ddef; background: #f3f7fe; }
    .toast.warn { color: #6c6049; border-color: #e7dcc6; background: #fbf7ef; }
    .toast.error { color: #5d5056; border-color: #e3d8dd; background: #f8f4f6; }

    .footer {
      padding: 11px 20px 16px;
      color: #5f646f;
      font-size: 12.5px;
      border-top: 1px solid rgba(121, 129, 145, 0.12);
      background: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.2px;
      backdrop-filter: blur(12px) saturate(132%);
      -webkit-backdrop-filter: blur(12px) saturate(132%);
    }

    @media (max-width: 780px) {
      body {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
        background: linear-gradient(180deg, #f3f5f9, #eceff4);
        overflow: hidden;
      }
      body::before,
      body::after {
        display: none;
      }
      .app {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        border: 0;
        box-shadow: none;
        backdrop-filter: saturate(120%) blur(10px);
        -webkit-backdrop-filter: saturate(120%) blur(10px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .app::before,
      .app::after {
        opacity: 0.6;
      }
      .hero {
        padding:
          calc(14px + env(safe-area-inset-top))
          14px
          12px;
      }
      .hero h1 { font-size: 26px; }
      .hero p {
        font-size: 14px;
        margin-top: 7px;
        max-width: 100%;
      }
      .hero-top {
        margin-bottom: 10px;
      }
      .status-bar { gap: 8px; }
      .body {
        flex: 1;
        grid-template-columns: 1fr;
        padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
        gap: 10px;
        overflow: hidden;
      }
      .card {
        border-radius: 14px;
        padding: 12px;
      }
      .card h2 {
        font-size: 15px;
        margin-bottom: 8px;
      }
      .button-row { width: 100%; }
      .btn {
        flex: 1;
        min-height: 38px;
        padding: 8px 12px;
      }
      .line-controls { gap: 5px; }
      .number-input {
        width: 78px;
        padding: 6px 7px;
        min-height: 36px;
      }
      .theme-toggle { padding: 6px 10px; }
      .line + .line { margin-top: 9px; }
      .scene-grid {
        margin-top: 6px;
        gap: 8px;
      }
      .scene-note {
        margin-top: 8px;
        line-height: 1.35;
      }
      .sync-line {
        margin-top: 12px;
      }
    }

    @media (max-width: 430px) {
      .hero h1 { font-size: 24px; }
      .hero p { font-size: 13px; margin-top: 6px; }
      .chip { font-size: 12px; }
      .scene-note { font-size: 12.5px; }
      .toast { font-size: 13px; }
      .theme-toggle { font-size: 11.5px; }
    }

    html[data-theme="dark"] {
      --bg-top: #151920;
      --bg-bottom: #0f1218;
      --panel: rgba(20, 24, 31, 0.62);
      --panel-2: rgba(22, 27, 35, 0.68);
      --ink: #f7f9fc;
      --muted: #d0d6df;
      --accent: #9bb7e5;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.38);
    }

    html[data-theme="dark"] body::before {
      background: radial-gradient(circle, rgba(97, 133, 186, 0.5), rgba(97, 133, 186, 0));
    }

    html[data-theme="dark"] body::after {
      background: radial-gradient(circle, rgba(171, 125, 84, 0.38), rgba(171, 125, 84, 0));
    }

    html[data-theme="dark"] .app {
      border-color: rgba(255, 255, 255, 0.18);
    }

    html[data-theme="dark"] .hero {
      background:
        radial-gradient(circle at 82% 8%, rgba(112, 152, 212, 0.28), rgba(112, 152, 212, 0)),
        linear-gradient(180deg, rgba(30, 36, 46, 0.74), rgba(22, 27, 35, 0.45));
      border-bottom-color: rgba(255, 255, 255, 0.08);
    }

    html[data-theme="dark"] .hero-tag {
      background: rgba(118, 149, 196, 0.18);
      border-color: rgba(118, 149, 196, 0.34);
      color: #bdd3f4;
    }

    html[data-theme="dark"] .theme-toggle {
      background: linear-gradient(180deg, rgba(34, 40, 50, 0.78), rgba(25, 30, 38, 0.6));
      border-color: rgba(255, 255, 255, 0.14);
      color: #d5dae3;
    }

    html[data-theme="dark"] .theme-toggle:hover {
      background: linear-gradient(180deg, rgba(42, 48, 60, 0.84), rgba(31, 36, 45, 0.64));
    }

    html[data-theme="dark"] .hero h1,
    html[data-theme="dark"] .card h2 {
      color: #f7f9fc;
    }

    html[data-theme="dark"] .chip {
      background: rgba(40, 46, 57, 0.72);
      border-color: rgba(255, 255, 255, 0.09);
      color: #e7edf7;
    }

    html[data-theme="dark"] .chip.on {
      background: rgba(56, 67, 76, 0.62);
      border-color: rgba(157, 176, 199, 0.32);
      color: #e3e9f3;
    }

    html[data-theme="dark"] .chip.off {
      background: rgba(59, 52, 56, 0.56);
      border-color: rgba(176, 139, 137, 0.3);
      color: #e3d0d2;
    }

    html[data-theme="dark"] .chip#chip-brightness {
      background: rgba(62, 81, 110, 0.54);
      border-color: rgba(126, 153, 194, 0.34);
      color: #d8e5ff;
    }

    html[data-theme="dark"] .chip#chip-temp {
      background: rgba(96, 77, 54, 0.52);
      border-color: rgba(185, 153, 113, 0.36);
      color: #f4dfc1;
    }

    html[data-theme="dark"] .card {
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.26);
    }

    html[data-theme="dark"] .btn,
    html[data-theme="dark"] .btn-on,
    html[data-theme="dark"] .btn-off,
    html[data-theme="dark"] .btn-ghost,
    html[data-theme="dark"] .scene {
      background: linear-gradient(180deg, rgba(48, 54, 65, 0.9), rgba(34, 39, 48, 0.82));
      border-color: rgba(255, 255, 255, 0.14);
      color: #f4f7fd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
    }

    html[data-theme="dark"] .btn:hover {
      background: linear-gradient(180deg, rgba(58, 65, 77, 0.84), rgba(40, 45, 55, 0.7));
    }

    html[data-theme="dark"] .scene[data-scene="暖白"] { color: #f1dcc0; }
    html[data-theme="dark"] .scene[data-scene="自然"] { color: #d4e2c7; }
    html[data-theme="dark"] .scene[data-scene="冷白"] { color: #cfdcf5; }
    html[data-theme="dark"] .scene[data-scene="阅读"] { color: #ccdbf2; }
    html[data-theme="dark"] .scene[data-scene="睡前"] { color: #e8cfaa; }

    html[data-theme="dark"] .number-input {
      background: rgba(37, 42, 51, 0.86);
      border-color: rgba(255, 255, 255, 0.2);
      color: #f7f9fd;
    }

    html[data-theme="dark"] .number-input:focus {
      outline-color: rgba(164, 187, 228, 0.3);
      border-color: rgba(164, 187, 228, 0.55);
    }

    html[data-theme="dark"] .toast {
      background: rgba(32, 37, 46, 0.76);
      border-color: rgba(255, 255, 255, 0.16);
      color: #e9eef7;
    }

    html[data-theme="dark"] .toast.ok { color: #d6e4ff; border-color: rgba(136, 162, 209, 0.34); background: rgba(43, 58, 82, 0.56); }
    html[data-theme="dark"] .toast.warn { color: #f1dfc1; border-color: rgba(180, 148, 109, 0.36); background: rgba(78, 61, 38, 0.5); }
    html[data-theme="dark"] .toast.error { color: #f1d7db; border-color: rgba(179, 130, 139, 0.36); background: rgba(76, 46, 52, 0.5); }

    html[data-theme="dark"] .footer {
      color: #c6ccd6;
      border-top-color: rgba(255, 255, 255, 0.09);
      background: rgba(22, 27, 35, 0.6);
    }

    @media (max-width: 780px) {
      html[data-theme="dark"] body {
        background: linear-gradient(180deg, #171b22, #11151c);
      }
      html[data-theme="dark"] .app {
        border: 0;
        box-shadow: none;
      }
      html[data-theme="dark"] .hero {
        border-bottom-color: rgba(255, 255, 255, 0.06);
      }
      html[data-theme="dark"] .card {
        background: rgba(24, 30, 39, 0.76);
      }
      html[data-theme="dark"] .footer {
        background: rgba(18, 23, 30, 0.72);
      }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="hero-top">
        <span class="hero-tag">Home</span>
        <button class="theme-toggle" id="theme-toggle" type="button">深色</button>
      </div>
      <h1>台灯控制台</h1>
      <p>局域网直连，无需云端。支持开关、亮度、色温、场景控制。</p>
      <div class="status-bar">
        <span class="chip" id="chip-power">电源状态: --</span>
        <span class="chip" id="chip-brightness">亮度: --%</span>
        <span class="chip" id="chip-temp">色温: --K</span>
      </div>
    </section>

    <section class="body">
      <div class="card">
        <h2>即时控制</h2>
        <div class="line">
          <span>电源</span>
          <div class="button-row">
            <button class="btn btn-on" id="btn-on">开灯</button>
            <button class="btn btn-off" id="btn-off">关灯</button>
          </div>
        </div>

        <div class="line">
          <span>亮度</span>
          <div class="line-controls">
            <input class="number-input" id="brightness-input" type="number" min="1" max="100" step="1" value="60">
            <button class="btn btn-ghost" id="apply-brightness">应用</button>
          </div>
        </div>
        <div class="range-wrap">
          <input id="brightness" type="range" min="1" max="100" value="60">
          <div class="range-meta">
            <span>1%</span>
            <strong id="brightness-value">60%</strong>
            <span>100%</span>
          </div>
        </div>

        <div class="line">
          <span>色温</span>
          <div class="line-controls">
            <input class="number-input" id="temp-input" type="number" min="2700" max="5100" step="50" value="4000">
            <button class="btn btn-ghost" id="apply-temp">应用</button>
          </div>
        </div>
        <div class="range-wrap">
          <input id="temp" type="range" min="2700" max="5100" step="50" value="4000">
          <div class="range-meta">
            <span>2700K</span>
            <strong id="temp-value">4000K</strong>
            <span>5100K</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>场景模式</h2>
        <div class="scene-grid">
          <button class="btn scene" data-scene="暖白">暖白</button>
          <button class="btn scene" data-scene="自然">自然</button>
          <button class="btn scene" data-scene="冷白">冷白</button>
          <button class="btn scene" data-scene="阅读">阅读</button>
          <button class="btn scene" data-scene="睡前">睡前</button>
        </div>
        <p class="scene-note">
          点击场景将使用场景预设色温与亮度；若需细调，请在左侧单独设置亮度/色温。
        </p>

        <div class="line sync-line">
          <span>状态同步</span>
          <div class="button-row">
            <button class="btn btn-ghost" id="refresh">刷新状态</button>
          </div>
        </div>

        <div class="toast" id="toast">准备就绪</div>
      </div>
    </section>

  </main>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    const chipPower = $("#chip-power");
    const chipBrightness = $("#chip-brightness");
    const chipTemp = $("#chip-temp");
    const brightness = $("#brightness");
    const temp = $("#temp");
    const brightnessInput = $("#brightness-input");
    const tempInput = $("#temp-input");
    const brightnessValue = $("#brightness-value");
    const tempValue = $("#temp-value");
    const themeToggle = $("#theme-toggle");
    const toast = $("#toast");
    const controls = [
      $("#btn-on"), $("#btn-off"), $("#apply-brightness"), $("#apply-temp"),
      $("#refresh"), brightness, temp, brightnessInput, tempInput, ...$$(".scene")
    ];

    const LIVE_THROTTLE_MS = 100;
    const THEME_KEY = "lamp_theme";
    let busy = false;

    const live = {
      brightness: {
        name: "亮度",
        isDragging: false,
        inFlight: false,
        pendingValue: Number(brightness.value),
        lastSentValue: null,
        nextAllowedAt: 0,
        timer: null,
        send: (value) => api("/api/brightness", "POST", { value })
      },
      temp: {
        name: "色温",
        isDragging: false,
        inFlight: false,
        pendingValue: Number(temp.value),
        lastSentValue: null,
        nextAllowedAt: 0,
        timer: null,
        send: (value) => api("/api/color_temp", "POST", { value })
      }
    };

    function resolveInitialTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "浅色" : "深色";
      themeToggle.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }

    function initTheme() {
      applyTheme(resolveInitialTheme());
      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {
          // 静默失败：不影响主流程
        });
      });
    }

    function setBusy(v) {
      busy = v;
      controls.forEach((el) => { el.disabled = v; });
    }

    function setToast(msg, level = "") {
      toast.textContent = msg;
      toast.className = "toast" + (level ? " " + level : "");
    }

    function anyDragging() {
      return live.brightness.isDragging || live.temp.isDragging;
    }

    function updateRangeText() {
      brightnessValue.textContent = `${brightness.value}%`;
      tempValue.textContent = `${temp.value}K`;
      brightnessInput.value = String(brightness.value);
      tempInput.value = String(temp.value);
    }

    function clampInt(value, min, max, step) {
      let v = Number(value);
      if (Number.isNaN(v)) v = min;
      if (v < min) v = min;
      if (v > max) v = max;
      if (step > 1) {
        v = Math.round(v / step) * step;
      }
      return Math.trunc(v);
    }

    function syncBrightnessFromInput() {
      const v = clampInt(brightnessInput.value, 1, 100, 1);
      brightness.value = String(v);
      live.brightness.pendingValue = v;
      updateRangeText();
      return v;
    }

    function syncTempFromInput() {
      const v = clampInt(tempInput.value, 2700, 5100, 50);
      temp.value = String(v);
      live.temp.pendingValue = v;
      updateRangeText();
      return v;
    }

    function updateStatusUI(s) {
      chipPower.textContent = `电源状态: ${s.on ? "开" : "关"}`;
      chipBrightness.textContent = `亮度: ${s.brightness}%`;
      chipTemp.textContent = `色温: ${s.color_temp}K`;
      chipPower.classList.toggle("on", s.on);
      chipPower.classList.toggle("off", !s.on);
      if (!anyDragging()) {
        brightness.value = String(s.brightness);
        temp.value = String(s.color_temp);
        live.brightness.pendingValue = s.brightness;
        live.temp.pendingValue = s.color_temp;
        live.brightness.lastSentValue = s.brightness;
        live.temp.lastSentValue = s.color_temp;
      }
      updateRangeText();
    }

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `请求失败 (${res.status})`);
      }
      return data;
    }

    async function refreshStatus(silent = false) {
      try {
        const data = await api("/api/status");
        updateStatusUI(data);
        if (!silent) setToast("状态已刷新", "ok");
      } catch (err) {
        setToast(`状态获取失败: ${err.message}`, "error");
      }
    }

    function scheduleLiveSend(state, forceNow = false) {
      if (state.timer) {
        clearTimeout(state.timer);
        state.timer = null;
      }
      if (forceNow) {
        void flushLiveSend(state, true);
        return;
      }
      const wait = Math.max(0, state.nextAllowedAt - Date.now());
      state.timer = setTimeout(() => {
        state.timer = null;
        void flushLiveSend(state, false);
      }, wait);
    }

    async function flushLiveSend(state, forceNow) {
      if (busy) return;
      const value = Number(state.pendingValue);
      if (!forceNow) {
        if (state.inFlight) return;
        if (state.lastSentValue === value) return;
        if (Date.now() < state.nextAllowedAt) {
          scheduleLiveSend(state, false);
          return;
        }
      } else if (state.inFlight) {
        // 正在发送时收到“最终提交”，等当前请求结束后自动补发最新值。
        return;
      }

      state.inFlight = true;
      state.nextAllowedAt = Date.now() + LIVE_THROTTLE_MS;

      try {
        await state.send(value);
        state.lastSentValue = value;
      } catch (err) {
        setToast(`${state.name}实时同步失败: ${err.message}`, "warn");
      } finally {
        state.inFlight = false;
        if (Number(state.pendingValue) !== state.lastSentValue) {
          scheduleLiveSend(state, false);
        }
      }
    }

    function bindLiveSlider(inputEl, state, onInput) {
      const updatePending = () => {
        state.pendingValue = Number(inputEl.value);
      };

      const endDrag = () => {
        if (!state.isDragging) return;
        state.isDragging = false;
        updatePending();
        scheduleLiveSend(state, true);
      };

      inputEl.addEventListener("pointerdown", () => {
        state.isDragging = true;
      });
      inputEl.addEventListener("pointerup", endDrag);
      inputEl.addEventListener("pointercancel", endDrag);
      inputEl.addEventListener("change", () => {
        updatePending();
        scheduleLiveSend(state, true);
      });
      inputEl.addEventListener("input", () => {
        onInput();
        updatePending();
        scheduleLiveSend(state, false);
      });
    }

    function bindManualInput(inputEl, syncFn, applyFn) {
      inputEl.addEventListener("input", () => {
        syncFn();
      });
      inputEl.addEventListener("change", () => {
        syncFn();
      });
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          syncFn();
          applyFn();
        }
      });
      inputEl.addEventListener("blur", () => {
        syncFn();
      });
    }

    async function runAction(label, fn) {
      if (busy) return;
      setBusy(true);
      setToast(`${label}中...`, "warn");
      try {
        await fn();
        await refreshStatus(true);
        setToast(`${label}成功`, "ok");
      } catch (err) {
        setToast(`${label}失败: ${err.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    bindLiveSlider(brightness, live.brightness, updateRangeText);
    bindLiveSlider(temp, live.temp, updateRangeText);

    window.addEventListener("pointerup", () => {
      [live.brightness, live.temp].forEach((state) => {
        if (!state.isDragging) return;
        state.isDragging = false;
        scheduleLiveSend(state, true);
      });
    });

    $("#btn-on").addEventListener("click", () =>
      runAction("开灯", () => api("/api/power", "POST", { on: true })));

    $("#btn-off").addEventListener("click", () =>
      runAction("关灯", () => api("/api/power", "POST", { on: false })));

    $("#apply-brightness").addEventListener("click", () =>
      runAction("设置亮度", () => api("/api/brightness", "POST", { value: Number(brightness.value) })));

    $("#apply-temp").addEventListener("click", () =>
      runAction("设置色温", () => api("/api/color_temp", "POST", { value: Number(temp.value) })));

    bindManualInput(
      brightnessInput,
      syncBrightnessFromInput,
      () => $("#apply-brightness").click()
    );
    bindManualInput(
      tempInput,
      syncTempFromInput,
      () => $("#apply-temp").click()
    );

    $("#refresh").addEventListener("click", () => refreshStatus(false));

    $$(".scene").forEach((btn) => {
      btn.addEventListener("click", () => {
        const scene = btn.dataset.scene;
        runAction(`应用场景(${scene})`, () =>
          api("/api/scene", "POST", {
            name: scene
          })
        );
      });
    });

    updateRangeText();
    initTheme();
    registerServiceWorker();
    refreshStatus(true);
    setInterval(() => {
      if (!busy && !anyDragging()) refreshStatus(true);
    }, 15000);
  </script>
</body>
</html>
